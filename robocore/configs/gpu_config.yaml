# RoboCore GPU Accelerated Configuration
# =======================================
# Optimized for large-scale batch processing on GPU

robot:
  urdf_path: "robocore/assets/robot/urdf/Alicia-D_v5_4/alicia_duo_with_gripper.urdf"
  end_link: "tool0"
  base_link: null

kinematics:
  # Forward Kinematics - use PyTorch for batch operations
  fk_backend: "torch"
  return_end_only: true
  
  # Inverse Kinematics - GPU accelerated
  ik:
    method: "dls"
    backend: "torch"
    solver:
      max_iterations: 100
      position_tolerance: 1.0e-4
      orientation_tolerance: 1.0e-4
      damping: 0.01
  
  # Jacobian - GPU accelerated
  jacobian_method: "analytic"
  jacobian_backend: "torch"
  
  # Compute backend - CUDA GPU
  compute:
    backend: "torch"
    device: "cuda:0"  # Change to cuda:1, cuda:2, or mps as needed
    dtype: "float32"
    batch_size: 1000
    use_jit: false  # Set to true for JIT compilation (faster after warmup)

# Logging
verbose: false
log_level: "INFO"
seed: 42
