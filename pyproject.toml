[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synria-robocore"
version = "2.5.0rc1"
description = "Unified High-Throughput Robotics Library"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Synria Robotics Team", email = "support@synriarobotics.ai"}
]
license = {text = "MIT"}
keywords = ["robotics", "kinematics", "robotics-library", "mujoco"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "opencv-python>=4.7.0",
    "sympy>=1.11.0",
    "pandas>=2.0.0",
    "pillow>=9.4.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "trimesh>=4.9.0",
    "coacd",
    # 0.0.14 depends on deprecated PyPI name "sklearn"; 0.0.15 uses "scikit-learn"
    "mesh_to_sdf>=0.0.15",
    "lxml",
    "tqdm",
]

# Optional dependencies
[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
mujoco = [
    "mujoco>=2.3.0",
    "PyOpenGL",
    "pyglet==1.5.27",
]
sim = [
    "mujoco>=2.3.0",
    "mujoco-py>=2.1.0",
    "PyOpenGL",
    "pyglet==1.5.27",
]
descriptions = [
    "synriard>=1.2.0",
    "openrd>=1.0.0",
]
dev = [
    "black",
    "ruff",
    "pytest",
    "mypy",
]
all = [
    "torch>=2.0.0",
    "mujoco>=2.3.0",
    "mujoco-py>=2.1.0",
    "PyOpenGL",
    "pyglet==1.5.27",
    "synriard>=1.2.0",
    "openrd>=1.0.0",
    "black",
    "ruff",
    "pytest",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/Synria-Robotics/RoboCore"

[tool.setuptools]
# Automatically find all packages and subpackages, excluding tests and examples
packages = {find = {include = ["robocore", "robocore.*"]}}
include-package-data = true

[tool.setuptools.package-data]
# Include all XML, YAML, and YML files in the robocore package
robocore = [
    "**/*.xml",
    "**/*.yaml",
    "**/*.yml",
]
